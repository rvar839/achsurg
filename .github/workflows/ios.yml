name: iOS

on:
  push:
    branches: [main]
    paths-ignore: ["web/**", "docs/**", "*.md"]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build & test
        run: |
          set -o pipefail
          # Use whichever iPhone simulator this runner has.
          UDID=$(xcrun simctl list devices available | grep -m1 -E "^ +iPhone" | grep -oE "[0-9A-F]{8}-[0-9A-F-]{27}")
          echo "Simulator: $UDID"
          xcodebuild test \
            -project Absite.xcodeproj \
            -scheme Absite \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
