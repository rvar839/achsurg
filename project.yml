name: Absite
options:
  bundleIdPrefix: com.vibgen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    DEVELOPMENT_TEAM: "" # set your Apple Developer Team ID
targets:
  Absite:
    type: application
    platform: iOS
    sources: [Absite]
    entitlements:
      path: Absite/Absite.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:absite.vibgen.com
          - webcredentials:absite.vibgen.com
    info:
      path: Absite/Info.plist
      properties:
        CFBundleDisplayName: Absite
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibgen.absite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  AbsiteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AbsiteTests]
    dependencies:
      - target: Absite
schemes:
  Absite:
    build:
      targets:
        Absite: all
        AbsiteTests: [test]
    test:
      targets: [AbsiteTests]
